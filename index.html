<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice / Creative</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="logo">Practice / Creative</span>
    </header>

    <main class="stage" id="stage">
      <div class="center-col">
        <div class="card-slot" aria-live="polite">
          <p class="loading" id="loading">Loading…</p>
          <div class="block-wrap" id="block-wrap" hidden></div>
        </div>
        <div class="actions">
          <button type="button" class="another" id="another" disabled>Another</button>
        </div>
      </div>
    </main>
  </div>

  <dialog class="image-lightbox" id="image-lightbox" aria-label="Full size image">
    <button type="button" class="image-lightbox__close" id="image-lightbox-close" aria-label="Close">×</button>
    <img class="image-lightbox__img" id="image-lightbox-img" alt="" />
  </dialog>

  <p class="sr-only">Press Space or right arrow for another block</p>

  <script src="js/app.js"></script>

</body>
</html>
