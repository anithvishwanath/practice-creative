<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Practice / Creative</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/">Practice / Creative</a>
    <a class="nav-link" id="nav-link" href="#/archive">Archive</a>
  </header>

  <main class="page" id="page">
    <h1 class="page-title" id="page-title"></h1>
    <div class="block-slot" id="block-slot" aria-live="polite"></div>
    <div class="credit" id="credit" hidden></div>
    <p class="note" id="note" hidden></p>
    <div class="archive" id="archive" hidden></div>
  </main>

  <dialog class="image-lightbox" id="image-lightbox" aria-label="Full size image">
    <button type="button" class="image-lightbox__close" id="image-lightbox-close" aria-label="Close">×</button>
    <img class="image-lightbox__img" id="image-lightbox-img" alt="" />
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
